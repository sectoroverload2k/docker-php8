---
apiVersion: v1
kind: Namespace
metadata:
  name: homenet
  labels:
    name: homenet
---
apiVersion: v1
kind: Service
metadata:
  name: loadbalancer-120
  namespace: default 
spec:
  selector:
    app: apache
  type: LoadBalancer
  loadBalancerIP: 192.168.69.120
  externalTrafficPolicy: Local
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: loadbalancer-121
  namespace: default
spec:
  selector:
    app: apache
  type: LoadBalancer
  loadBalancerIP: 192.168.69.121
  externalTrafficPolicy: Local
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: http-ingress
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: apache
            port:
              number: 80
